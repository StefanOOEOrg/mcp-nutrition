# Organization-wide lint rule set (StefanOOEOrg): one ruff config for every repository,
# so a reviewer diffs only `target-version` between repos. Repo-specific exceptions belong
# in `[tool.ruff.lint.per-file-ignores]` with a comment saying why.
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
